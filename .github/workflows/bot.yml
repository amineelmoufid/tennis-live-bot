name: Tennis Live Bot Scheduler

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write # Allows the bot to commit the state.json file back

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Market Scanner
        run: python action_bot.py

      - name: Commit state.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json || true
          git commit -m "Update state to prevent duplicate telegram alerts" || true
          git push || true
